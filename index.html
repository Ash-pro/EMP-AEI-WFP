let PIN='';
const rpc=async(fn,args)=>{let r;try{r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CONFIG.SUPABASE_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}

const subs={},snapOf=rows=>({docs:(rows||[]).map(x=>({id:x.id,data:()=>x.data})),empty:!(rows&&rows.length)});
async function refresh(c){if(!subs[c])return;const rows=await rpc('aei_list',{p:PIN,c});subs[c].forEach(f=>f(snapOf(rows)))}
const DB={doc(path){const [c,i]=path.split('/');return{set:d=>rpc('aei_set',{p:PIN,c,i,d}).then(()=>refresh(c)),update:d=>rpc('aei_update',{p:PIN,c,i,d}).then(()=>refresh(c)),delete:()=>rpc('aei_delete',{p:PIN,c,i}).then(()=>refresh(c))}},
 collection(c){const q={limit:()=>q,orderBy:()=>q,get:async()=>{const rows=await rpc('aei_list',{p:PIN,c});rows.sort((a,b)=>(b.data.ts||0)-(a.data.ts||0));return snapOf(rows.slice(0,2000))},
  onSnapshot(f,err){(subs[c]=subs[c]||[]).push(f);refresh(c).catch(e=>err&&err(e))},add:d=>rpc('aei_set',{p:PIN,c,i:Date.now().toString(36)+Math.random().toString(36).slice(2,7),d})};return q}};

function routeUrl(n){return WEB?location.origin+'/'+n:location.href.split('#')[0]+'#'+n}
function setPath(n){try{if(WEB)history.pushState(null,'','/'+n);else history.pushState(null,'',n?'#'+n:location.pathname)}catch(e){}}

(async()=>{

  try{for(let i=0;i<a.length;i++){const x=a[i];try{const r=await rpc('aei_ast_submit',{pt:x.pt,code:x.code,d:x.d});if(r&&r.ok)sent++;else toast('لم يُقبل طلب محفوظ ('+x.iname+'): '+(r&&r.msg||''),6000)}
      catch(e){if(e&&e.code==='network'){left=a.slice(i);break}toast('لم يُقبل طلب محفوظ: '+(e.message||''),6000)}}}
  finally{astQ.set(left);astBusy=false}
  if(sent){toast(`أُرسل ${sent} طلب محفوظ`);await astReload(true)}else if(manual)toast(left.length?'لا يزال الاتصال غير متاح':'لا توجد طلبات محفوظة')}
addEventListener('online',()=>astFlush());
setInterval(()=>{if(AST&&!document.hidden){astFlush();if(AST.view==='home')astReload(true)}},60000);

/* events */
document.addEventListener('submit',ev=>{const f=ev.target,id=f.getAttribute('id');const fn={axlf:astLogin,axef:astSubmit,axrv:axApprove,axaf:axAddSave,axmf:axMoveSave,axcf:axCatSave,axsf:axSupSave,axcrv:axCountApprove,axqf:axReqSave,axrcf:astRecvSave,axcnf:astCountSave}[id];if(fn){ev.preventDefault();fn(f)}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-ax]');if(!t)return;const a=t.dataset.ax,d=t.dataset;if(a==='noop')return;
  if(a==='sub'){S.af.sub=d.v;vAst()}
  else if(a==='ev')axEv(d.id); else if(a==='rej')axReject(t); else if(a==='cancel')axCancel(t); else if(a==='pt')axPoint(d.axp);
  else if(a==='add')axAdd(d.axp||''); else if(a==='move')axMove(d.axp||''); else if(a==='import')axImport(); else if(a==='imgo')axImGo(t); else if(a==='export')axExport();
  else if(a==='cat')axCatEdit(d.id); else if(a==='catnew')axCatEdit(''); else if(a==='catrej')axCatReject(t);
  else if(a==='genall')axGen(allPoints().filter(p=>p!=='إداري'&&!S.apin.has(p)),t); else if(a==='gen1')axGen([d.axp],t).then(()=>{if(dlg.open)axPoint(d.axp)}); else if(a==='regen')axRegen(t); else if(a==='copyall')axCopyAll();
  else if(a==='pgo')go('assets'); else if(a==='pout'){AST=null;astSS.set(null);renderAssets()} else if(a==='pnew')astNew(); else if(a==='phome')astHome(); else if(a==='flush')astFlush(true);
  else if(a==='qm'||a==='qp'){const i=$('#e-q');i.value=Math.max(1,(parseInt(i.value,10)||1)+(a==='qp'?1:-1))}
  else if(a==='prcv')astRecv(d.id,d.ok==='1'); else if(a==='pcount')astCount(d.id);
  else if(a==='reqnew')axReqNew(); else if(a==='reqv')axReqView(d.id); else if(a==='reqclose')axReqStatus(t,'مغلق'); else if(a==='reqopen')axReqStatus(t,'مفتوح'); else if(a==='repx')axRepExport();
  else if(a==='reqall')document.querySelectorAll('#axqf input[data-rp]').forEach(x=>x.checked=d.v==='1'); else if(a==='reqreg')document.querySelectorAll('#axqf input[data-rp]').forEach(x=>{if(x.dataset.rg===d.v)x.checked=true});
  else if(a==='pick'){const s=$('#e-item');s.value=d.id;astSync()}});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.id&&el.id.startsWith('axf-')){const k=el.id.slice(4);S.af[k]=el.value;({bal:axBal,log:axLog,rep:axRep})[S.af.sub]?.();if(k==='q'){const q=$('#axf-q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}return}
  if(el.id==='ax-file')return axParse(el);if(el.dataset&&(el.dataset.impp!==undefined||el.dataset.impi!==undefined))return axImSum();
  const f=el.form;if(!f)return;
  if(el.id==='e-by'&&f.id!=='axef'){const o=f.querySelector('#ax-byo');if(o)o.hidden=el.value!=='__other'}
  if(f.id==='axcnf'&&f.dataset.sure){delete f.dataset.sure;const b=f.querySelector('.pri');if(b)b.textContent='إرسال الجرد للاعتماد'}
  if(f.id==='axef'){if(el.id==='e-newName')astSim(el);astSync()}
  else if(f.id==='axrv')axAfter(); else if(f.id==='axaf'){if(el.id==='e-pt'||el.id==='e-item'||el.id==='e-type'){f.querySelectorAll('#e-ng,#e-nd').forEach(x=>x.value='');axAddSync()}}
  else if(f.id==='axmf'&&el.id==='e-from')axMoveRows()});

/* ===================== المهام ===================== */
const TK={list:null,at:0,busy:false,err:'',cur:null,users:null,badge:{total:0},f:{q:'',st:'open',who:'',pr:'',scope:'all',vs:''}};
const TK_AS={new:['جديدة','st-new'],received:['مستلمة','tk-s1'],in_progress:['قيد التنفيذ','tk-s1'],review:['بانتظار الاعتماد','tk-s2'],done:['معتمدة','st-ok'],returned:['مُرجعة','st-no']};
const TK_TS={open:'مفتوحة',closed:'مكتملة',cancelled:'ملغاة'};
const TK_PR={normal:['عادية',''],high:['مهمة','tk-hi'],urgent:['عاجلة','tk-ur']};
const TK_EV={created:'أنشأ المهمة',assigned:'أسند المهمة إلى',unassigned:'أزال الإسناد عن',edited:'عدّل بيانات المهمة',received:'استلم المهمة',progress:'حدّث نسبة الإنجاز',reply:'كتب ردّاً',approved:'اعتمد الإنجاز',returned:'أرجع المهمة',cancelled:'ألغى المهمة',reopened:'أعاد فتح المهمة'};
const tkD=ms=>ms?new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const tkDay=s=>s?String(s).split('-').reverse().join('/'):'—';
const tkSt=s=>{const x=TK_AS[s]||[s,''];return `<span class="st ${x[1]}">${x[0]}</span>`};
const tkPr=p=>p&&p!=='normal'&&TK_PR[p]?`<span class="tk-pr ${TK_PR[p][1]}">${TK_PR[p][0]}</span>`:'';
const tkBar=v=>`<span class="tk-bar" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%"></i></span><b class="num tk-pc">${v}%</b>`;
const tkMine=t=>(t.asg||[]).find(a=>a.mine);
const tkStale=(t,a)=>t.status==='open'&&!['done','review'].includes(a.status)&&Date.now()-(a.last_at||t.created_at)>1728e5;
const tkDraft={get(k){try{return localStorage.getItem('tkd-'+k)||''}catch(e){return ''}},set(k,v){try{v?localStorage.setItem('tkd-'+k,v):localStorage.removeItem('tkd-'+k)}catch(e){}}};

async function tkBadge(){if(!S.user)return;try{const b=await rpc('aei_task_badge',{p:PIN})||{total:0};const ch=b.total!==TK.badge.total;TK.badge=b;if(ch&&S.ready&&!dlg.open)render()}catch(e){}}
async function tkLoad(force){if(!S.user||TK.busy)return;if(!force&&TK.list&&Date.now()-TK.at<20000)return;TK.busy=true;
  try{TK.list=await rpc('aei_task_list',{p:PIN})||[];TK.at=Date.now();TK.err=''}catch(e){TK.err=e.message}finally{TK.busy=false}
  if(S.tab==='tasks'&&!dlg.open)tkView()}
function vTasks(){if(!S.user){$('#view').innerHTML='<div class="empty">المهام تتطلب الدخول باسم المستخدم وكلمة المرور.</div>';return}tkView();tkLoad()}
function tkView(){const v=$('#view');if(!v||S.tab!=='tasks')return;
  if(!TK.list){v.innerHTML=TK.err?`<div class="note bad">تعذّر تحميل المهام: ${h(TK.err)}</div>`:'<div class="empty">جاري تحميل المهام…</div>';return}
  const keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
  if(isAdmin()&&TK.f.scope!=='mine')tkAdmin(v);else tkSup(v);
  if(keep){const el=document.getElementById(keep);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
function tkScope(){const n=TK.list.filter(t=>t.status!=='cancelled'&&tkMine(t)).length;if(!isAdmin()||!n)return '';
  return `<div class="lgchips" role="tablist"><button type="button" class="lgc${TK.f.scope!=='mine'?' on':''}" data-tk="scope" data-v="all">كل المهام</button><button type="button" class="lgc${TK.f.scope==='mine'?' on':''}" data-tk="scope" data-v="mine">المسندة لي <b>${n}</b></button></div>`}

function tkAdmin(v){const f=TK.f,L=TK.list,open=L.filter(t=>t.status==='open'),A=open.flatMap(t=>t.asg.map(a=>({t,a})));
  const FS={open:t=>t.status==='open',new:t=>t.status==='open'&&t.asg.some(a=>a.status==='new'),review:t=>t.status==='open'&&t.asg.some(a=>a.status==='review'),late:t=>t.overdue,
    stale:t=>t.asg.some(a=>tkStale(t,a)),closed:t=>t.status==='closed',cancelled:t=>t.status==='cancelled',all:()=>true};
  const qs=nrm(f.q).split(' ').filter(Boolean),hit=t=>{const s=nrm([t.title,t.details,t.point,'#'+t.id,...t.asg.map(a=>a.name+' '+(a.sup||''))].join(' '));return qs.every(w=>s.includes(w))};
  const rows=L.filter(FS[f.st]||FS.open).filter(t=>(!f.who||t.asg.some(a=>a.username===f.who))&&(!f.pr||t.priority===f.pr)&&(!qs.length||hit(t)));
  const who=[...new Map(L.flatMap(t=>t.asg).map(a=>[a.username,a.sup||a.name])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'ar'));
  const nNew=A.filter(x=>x.a.status==='new').length,nLate=open.filter(t=>t.overdue).length,nRev=A.filter(x=>x.a.status==='review').length,nStale=open.filter(t=>FS.stale(t)).length;
  const K=[['open',open.length,'مهمة مفتوحة',''],['new',nNew,'إسناد لم يُستلم',nNew?'hot':''],['review',nRev,'بانتظار الاعتماد',nRev?'hot':''],['late',nLate,'مهمة متأخرة',nLate?'bad':''],['stale',nStale,'بدون تحديث 48 ساعة',nStale?'bad':''],['closed',L.filter(t=>t.status==='closed').length,'مهمة مكتملة','']];
  const per={};L.filter(t=>t.status!=='cancelled').forEach(t=>t.asg.forEach(a=>{const p=per[a.username]=per[a.username]||{n:a.sup||a.name,o:0,nw:0,lt:0,rv:0,dn:0,st:0,pg:[]};
    if(a.status==='done')p.dn++;else if(t.status==='open'){p.o++;p.pg.push(a.progress);if(a.status==='new')p.nw++;if(a.status==='review')p.rv++;if(t.overdue)p.lt++;if(tkStale(t,a))p.st++}}));
  const pr=Object.entries(per).sort((a,b)=>a[1].n.localeCompare(b[1].n,'ar')),red=n=>n?` style="color:var(--bad);font-weight:700"`:'';
  v.innerHTML=`<div class="tk-top">${tkScope()||'<span></span>'}<button class="btn pri" data-tk="new">مهمة جديدة</button></div>
   <div class="kpis">${K.map(([k,n,l,c])=>`<div class="kpi ${c}${f.st===k?' on':''}" data-tk="st" data-v="${k}" role="button" tabindex="0"><b class="num">${n}</b><span>${l}</span></div>`).join('')}</div>
   <div class="filters"><input class="q" id="tkf-q" type="search" placeholder="بحث بالعنوان، التفاصيل، النقطة، المشرف…" value="${h(f.q)}" aria-label="بحث في المهام">
    <select id="tkf-st" aria-label="الحالة">${[['open','المفتوحة'],['new','لم تُستلم'],['review','بانتظار الاعتماد'],['late','المتأخرة'],['stale','بدون تحديث 48 ساعة'],['closed','المكتملة'],['cancelled','الملغاة'],['all','كل المهام']].map(([k,l])=>`<option value="${k}"${f.st===k?' selected':''}>${l}</option>`).join('')}</select>
    <select id="tkf-who" aria-label="المشرف"><option value="">كل المشرفين</option>${who.map(([u,n])=>`<option value="${h(u)}"${f.who===u?' selected':''}>${h(n)}</option>`).join('')}</select>
    <select id="tkf-pr" aria-label="الأولوية"><option value="">كل الأولويات</option>${Object.entries(TK_PR).map(([k,[l]])=>`<option value="${k}"${f.pr===k?' selected':''}>${l}</option>`).join('')}</select></div>
   <div class="hint"><span>المعروض <b>${rows.length}</b> من <b>${L.length}</b> مهمة</span><span>اضغط على أي مهمة لعرض التفاصيل والمتابعة</span></div>
   <div class="tk-list">${rows.map(tkCardA).join('')||'<div class="empty">لا توجد مهام مطابقة.</div>'}</div>
   ${pr.length?`<details class="tk-sum"${S.tkSum?' open':''} id="tk-sum"><summary>متابعة المشرفين</summary><div class="tw"><table><thead><tr><th>المشرف</th><th>مفتوحة</th><th>لم تُستلم</th><th>بانتظار الاعتماد</th><th>متأخرة</th><th>بدون تحديث</th><th>معتمدة</th><th>متوسط الإنجاز</th></tr></thead><tbody>
    ${pr.map(([u,p])=>`<tr data-tk="who" data-v="${h(u)}"><td class="nm">${h(p.n)}</td><td class="num">${p.o}</td><td class="num">${p.nw||'—'}</td><td class="num">${p.rv||'—'}</td><td class="num"${red(p.lt)}>${p.lt||'—'}</td><td class="num"${red(p.st)}>${p.st||'—'}</td><td class="num">${p.dn||'—'}</td><td class="num">${p.pg.length?Math.round(p.pg.reduce((a,b)=>a+b,0)/p.pg.length)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></details>`:''}`}
function tkCardA(t){return `<article class="tk-card${t.unread?' un':''}${t.overdue?' late':''}${t.status!=='open'?' off':''}" data-tk="open" data-id="${t.id}" tabindex="0">
  <div class="tk-h"><b class="tk-t">${h(t.title)}</b>${tkPr(t.priority)}${t.status!=='open'?`<span class="st ${t.status==='closed'?'st-ok':'st-no'}">${TK_TS[t.status]}</span>`:''}${t.unread?'<span class="tk-dot" title="تحديث جديد"></span>':''}</div>
  <div class="tk-m"><span class="num">#${t.id}</span>${t.point?`<span>${h(t.point)}</span>`:''}<span class="${t.overdue?'tk-late':''}">الاستحقاق: <span class="num">${tkDay(t.due)}</span>${t.overdue?' · متأخرة':''}</span><span>آخر تحديث: <span class="num">${tkD(t.last_at)}</span></span></div>
  <div class="tk-p">${tkBar(t.progress)}</div>
  <div class="tk-as">${t.asg.map(a=>`<span class="tk-a${tkStale(t,a)?' stale':''}"${tkStale(t,a)?' title="بدون تحديث منذ أكثر من 48 ساعة"':''}>${h(a.sup||a.name)} ${tkSt(a.status)} <b class="num">${a.progress}%</b></span>`).join('')}</div></article>`}

function tkSup(v){const f=TK.f,L=TK.list.filter(t=>t.status!=='cancelled'&&tkMine(t)),G={act:[],run:[],done:[]};
  L.forEach(t=>{const a=tkMine(t);(a.status==='new'||a.status==='returned'?G.act:a.status==='done'||t.status==='closed'?G.done:G.run).push(t)});
  if(!f.vs)f.vs=G.act.length?'act':'run';
  const seg=[['act','بحاجة لإجراء'],['run','جارية'],['done','منجزة']];
  v.innerHTML=`${isAdmin()?`<div class="tk-top">${tkScope()}<button class="btn pri" data-tk="new">مهمة جديدة</button></div>`:''}
   <div class="lgchips" role="tablist" style="margin-top:12px">${seg.map(([k,l])=>`<button type="button" class="lgc${f.vs===k?' on':''}" data-tk="vs" data-v="${k}">${l} <b>${G[k].length}</b></button>`).join('')}</div>
   <div class="tk-list">${G[f.vs].map(t=>{const a=tkMine(t);return `<article class="tk-card${t.unread?' un':''}${t.overdue?' late':''}" data-tk="open" data-id="${t.id}" tabindex="0">
     <div class="tk-h"><b class="tk-t">${h(t.title)}</b>${tkPr(t.priority)}${tkSt(a.status)}${t.unread?'<span class="tk-dot" title="تحديث جديد"></span>':''}</div>
     <div class="tk-m">${t.point?`<span>${h(t.point)}</span>`:''}<span class="${t.overdue?'tk-late':''}">الاستحقاق: <span class="num">${tkDay(t.due)}</span>${t.overdue?' · متأخرة':''}</span><span>من: ${h(t.created_by_name||'—')}</span></div>
     ${t.details?`<p class="tk-d">${h(t.details)}</p>`:''}<div class="tk-p">${tkBar(a.progress)}</div>
     ${a.status==='new'?`<button class="btn pri tk-big" data-tk="recv" data-a="${a.id}">استلام المهمة</button>`:a.status==='returned'?'<div class="note bad">أُرجعت المهمة. افتحها لقراءة السبب وتحديث الإنجاز.</div>':''}</article>`}).join('')
     ||`<div class="empty">${f.vs==='act'?'لا توجد مهام جديدة أو مُرجعة.':f.vs==='run'?'لا توجد مهام جارية.':'لا توجد مهام منجزة بعد.'}</div>`}</div>`}

async function tkOpen(id,quiet){const hd=head('تفاصيل المهمة');if(!quiet){dlg.innerHTML=hd+'<div class="db"><div class="empty">جاري التحميل…</div></div>';open()}
  try{TK.cur=await rpc('aei_task_get',{p:PIN,i:+id})}catch(e){dlg.innerHTML=hd+`<div class="db"><div class="note bad">${h(e.message)}</div></div>`;open();return}
  tkDlg();if(!quiet){TK.at=0;tkBadge()}}
function tkDlg(){const t=TK.cur,adm=isAdmin(),log=t.log||[],off=t.status==='cancelled',st=dlg.open?dlg.scrollTop:0;
  const asg=a=>{const mine=a.mine,ret=a.status==='returned'?[...log].reverse().find(x=>x.asg_id===a.id&&x.type==='returned'):null;let act='';
    if(!off){
      if(mine&&a.status==='new')act=`<button class="btn pri tk-big" data-tk="recv" data-a="${a.id}">استلام المهمة</button>`;
      else if(mine&&['received','in_progress','returned'].includes(a.status))act=`<form class="tk-f" id="tkpf-${a.id}" data-a="${a.id}">
        <label>نسبة الإنجاز: <b class="num" id="tkpv-${a.id}" style="color:var(--fg);font-size:15px">${a.progress}%</b><input type="range" id="tkp-${a.id}" name="v" min="0" max="100" step="10" value="${a.progress}" aria-label="نسبة الإنجاز"></label>
        <label>ما الذي تم إنجازه؟ (ملاحظة إلزامية)<textarea name="n" rows="3" maxlength="2000" data-draft="p${a.id}" required>${h(tkDraft.get('p'+a.id))}</textarea></label>
        <div class="acts"><button class="btn pri" id="tkpb-${a.id}">${a.progress===100?'إرسال للاعتماد':'حفظ التحديث'}</button><span class="muted" style="font-size:12.5px;align-self:center">عند 100% تُرسل المهمة للإدارة للاعتماد.</span></div></form>`;
      else if(mine&&a.status==='review')act='<div class="note">أرسلتَ المهمة للاعتماد، وستظهر نتيجة المراجعة هنا.</div>';
      if(adm&&!mine&&a.status==='review')act+=`<div class="tk-rv" id="tkrv-${a.id}"><button class="btn pri" data-tk="approve" data-a="${a.id}">اعتماد الإنجاز</button><button class="btn danger" data-tk="retform" data-a="${a.id}">إرجاع للمشرف</button></div>`;
      if(adm&&!mine&&a.status==='done')act+=`<div class="tk-rv" id="tkrv-${a.id}"><button class="btn sm" data-tk="retform" data-a="${a.id}">إعادة فتحها لهذا المشرف</button></div>`;
      if(adm&&mine&&a.status==='review')act+='<div class="muted" style="font-size:13px">يعتمدها مدير آخر.</div>';
      if(mine||adm)act+=`<form class="tk-f tk-rp" id="tkrf-${a.id}" data-a="${a.id}"><textarea name="n" rows="2" maxlength="2000" placeholder="${mine?'رد أو استفسار للإدارة…':'رد أو توجيه للمشرف…'}" data-draft="r${a.id}" aria-label="رد">${h(tkDraft.get('r'+a.id))}</textarea><button class="btn">إرسال رد</button></form>`}
    return `<section class="tk-asg${mine?' me':''}"><h3>${h(a.sup||a.name)}${a.sup&&a.sup!==a.name?` <small>(${h(a.name)})</small>`:''} ${tkSt(a.status)}${tkStale(t,a)?'<span class="st st-no">بدون تحديث 48 ساعة</span>':''}</h3>
      <div class="tk-p">${tkBar(a.progress)}</div>
      <div class="tk-m"><span>الاستلام: <span class="num">${tkD(a.received_at)}</span></span><span>آخر تحديث: <span class="num">${tkD(a.last_at)}</span></span>${a.done_at?`<span>الاعتماد: <span class="num">${tkD(a.done_at)}</span></span>`:''}</div>
      ${ret?`<div class="note bad"><b>سبب الإرجاع (${h(ret.by_name||'')}):</b> ${h(ret.note)}</div>`:''}${act}</section>`};
  const ev=x=>{const to=x.to_name&&adm&&x.by_name!==x.to_name;return `<li class="k-${x.type}"><b>${h(x.by_name||x.by||'—')}</b> ${TK_EV[x.type]||x.type}${x.type==='assigned'&&x.to_name?' <b>'+h(x.to_name)+'</b>':''}${x.type==='unassigned'?' <b>'+h(x.note)+'</b>':''}${x.type==='progress'?` <b class="num">${x.p_from??0}% ← ${x.p_to}%</b>`:''}${to&&x.type!=='assigned'?` <span class="muted">(${h(x.to_name)})</span>`:''}<span class="w">${tkD(x.at)}</span>
    ${x.note&&x.type!=='unassigned'?`<div class="n">${h(x.note)}</div>`:''}</li>`};
  dlg.innerHTML=head(`مهمة <span class="num">#${t.id}</span>`)+`<div class="db">
    <div class="tk-h"><b class="tk-t" style="font-size:18px">${h(t.title)}</b>${tkPr(t.priority)}<span class="st ${t.status==='closed'?'st-ok':t.status==='cancelled'?'st-no':'tk-s1'}">${TK_TS[t.status]}</span></div>
    ${off?'<div class="note bad">هذه المهمة ملغاة.</div>':''}
    <div class="tk-meta"><div><span>الاستحقاق</span><b class="num${t.overdue?' tk-late':''}">${tkDay(t.due)}${t.overdue?' · متأخرة':''}</b></div><div><span>النقطة</span>${h(t.point||'—')}</div><div><span>أنشأها</span>${h(t.created_by_name||'—')}</div><div><span>تاريخ الإنشاء</span><span class="num" style="color:var(--fg);font-size:13.5px;display:inline">${tkD(t.created_at)}</span></div>${adm?`<div><span>الإنجاز الكلي</span><b class="num">${t.progress}%</b></div>`:''}</div>
    ${t.details?`<p class="tk-det">${h(t.details)}</p>`:''}
    ${t.asg.map(asg).join('')}
    <h3 class="tk-sec">سجل المتابعة</h3><ol class="tk-tl">${log.map(ev).join('')||'<li>لا يوجد</li>'}</ol></div>
    ${adm?`<div class="df"><div>${!off&&t.status!=='closed'?`<button class="btn" data-tk="edit">تعديل / إسناد</button>`:''}${off?`<button class="btn" data-tk="reopen">إعادة فتح المهمة</button>`:t.status!=='closed'?`<button class="btn danger" data-tk="cancel">إلغاء المهمة</button>`:''}</div>${t.asg.every(a=>a.status==='new')?`<div><button class="btn danger" data-tk="del">حذف المهمة</button></div>`:''}</div>`:''}`;
  open();dlg.scrollTop=st}
function tkRetForm(b){const a=b.dataset.a,box=$('#tkrv-'+a);if(!box)return;
  box.outerHTML=`<form class="tk-f" id="tkvf-${a}" data-a="${a}"><label>سبب الإرجاع (يظهر للمشرف)<textarea name="n" rows="2" maxlength="2000" required></textarea></label><div class="acts"><button class="btn danger">تأكيد الإرجاع</button><button class="btn" type="button" data-tk="reload">تراجع</button></div></form>`;
  const ta=dlg.querySelector(`#tkvf-${a} textarea`);if(ta)ta.focus()}

async function tkAct(fn,args,msg,btn,ok){if(btn)btn.disabled=true;
  try{const r=await rpc(fn,{p:PIN,...args});if(ok)ok(r);if(msg)toast(msg);TK.at=0;tkLoad(true);tkBadge();if(dlg.open&&TK.cur&&fn!=='aei_task_delete')await tkOpen(TK.cur.id,true);return true}
  catch(e){if(btn)btn.disabled=false;toast(e.message);return false}}
async function tkEdit(){const t=dlg.open&&TK.cur&&TK.edit?TK.cur:null,hd=head(t?'تعديل المهمة والإسناد':'مهمة جديدة');
  dlg.innerHTML=hd+'<div class="db"><div class="empty">جاري التحميل…</div></div>';open();
  try{TK.users=await rpc('aei_task_users',{p:PIN})||[]}catch(e){dlg.innerHTML=hd+`<div class="db"><div class="note bad">${h(e.message)}</div></div>`;return}
  const sel=new Set(t?t.asg.map(a=>a.username):[]),pts=uniq('point').filter(p=>p!=='إداري'),sup=TK.users.filter(u=>u.sup),oth=TK.users.filter(u=>!u.sup);
  const ck=u=>{const lk=t&&t.asg.find(a=>a.username===u.username&&a.status!=='new');return `<label class="chk"><input type="checkbox" name="u" value="${h(u.username)}"${sel.has(u.username)?' checked':''}${lk?' disabled':''}> ${h(u.sup||u.name)}${u.sup&&u.sup!==u.name?` <small>${h(u.name)}</small>`:''}${lk?' <small>بدأ العمل</small>':''}</label>`};
  dlg.innerHTML=`<form id="tkef" data-id="${t?t.id:''}">`+hd+`<div class="db"><div id="ferr"></div><fieldset>
    <label class="wide">عنوان المهمة<input name="title" maxlength="200" required value="${h(t?t.title:'')}"></label>
    <label class="wide">التفاصيل والمطلوب<textarea name="details" rows="4" maxlength="4000">${h(t?t.details:'')}</textarea></label>
    <label>الأولوية<select name="priority">${Object.entries(TK_PR).map(([k,[l]])=>`<option value="${k}"${(t?t.priority:'normal')===k?' selected':''}>${l}</option>`).join('')}</select></label>
    <label>تاريخ الاستحقاق (اختياري)<input type="date" name="due" value="${h(t&&t.due||'')}"></label>
    <label>النقطة (اختياري)<select name="point"><option value="">—</option><option${t&&t.point==='كافة النقاط'?' selected':''}>كافة النقاط</option>${pts.map(p=>`<option${t&&t.point===p?' selected':''}>${h(p)}</option>`).join('')}</select></label></fieldset>
    <div><div class="tk-lbl">إسناد إلى المشرفين</div><div class="eclist">${sup.map(ck).join('')}${oth.length?`<div class="muted" style="font-size:12.5px;padding-top:8px">حسابات أخرى</div>${oth.map(ck).join('')}`:''}</div>
    ${t?'<div class="muted" style="font-size:12.5px;margin-top:6px">لا يمكن إزالة مشرف بدأ العمل على المهمة.</div>':''}</div></div>
    <div class="df"><div><button class="btn pri">${t?'حفظ التعديل':'إنشاء وإسناد'}</button><button class="btn" type="button" ${t?'data-tk="reload"':'data-act="close"'}>رجوع</button></div></div></form>`;
  open()}
async function tkSave(f){const g=n=>f.elements[n].value,users=[...f.querySelectorAll('input[name=u]:checked')].map(x=>x.value);
  if(g('title').trim().length<2)return ferr('أدخل عنوان المهمة.');if(!users.length)return ferr('اختر مشرفاً واحداً على الأقل.');
  const b=f.querySelector('.btn.pri');b.disabled=true;
  try{const id=await rpc('aei_task_save',{p:PIN,i:f.dataset.id?+f.dataset.id:null,d:{title:g('title'),details:g('details'),priority:g('priority'),due:g('due')||null,point:g('point'),users}});
    toast(f.dataset.id?'حُفظت المهمة':'أُنشئت المهمة وأُسندت');TK.edit=false;TK.at=0;tkLoad(true);tkBadge();await tkOpen(id)}catch(e){b.disabled=false;ferr(e.message)}}

document.addEventListener('submit',ev=>{const f=ev.target,id=f.id||'';if(!/^tk/.test(id))return;ev.preventDefault();
  if(id==='tkef')return tkSave(f);
  const a=+f.dataset.a,n=f.elements.n?f.elements.n.value.trim():'',b=f.querySelector('button:not([type=button])');
  if(id.startsWith('tkpf-')){const v=+f.elements.v.value;if(n.length<2)return toast('اكتب ملاحظة توضح ما تم إنجازه');
    return tkAct('aei_task_progress',{a_id:a,v,n},v===100?'أُرسلت المهمة للاعتماد':'حُفظ التحديث',b,()=>tkDraft.set('p'+a,''))}
  if(id.startsWith('tkrf-')){if(!n)return toast('اكتب الرد');return tkAct('aei_task_reply',{a_id:a,n},'أُرسل الرد',b,()=>tkDraft.set('r'+a,''))}
  if(id.startsWith('tkvf-')){if(n.length<2)return toast('اكتب سبب الإرجاع');return tkAct('aei_task_review',{a_id:a,ok:false,n},'أُرجعت المهمة للمشرف',b)}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-tk]');if(!t)return;const k=t.dataset.tk,d=t.dataset;
  if(k==='open'){TK.edit=false;return tkOpen(d.id)}
  if(k==='recv')return tkAct('aei_task_receive',{a_id:+d.a},'استُلمت المهمة. حدّث نسبة الإنجاز مع التقدم.',t);
  if(k==='approve')return tkAct('aei_task_review',{a_id:+d.a,ok:true,n:''},'اعتُمد الإنجاز',t);
  if(k==='retform')return tkRetForm(t);
  if(k==='reload'){TK.edit=false;return tkOpen(TK.cur.id)}
  if(k==='new'){TK.edit=false;TK.cur=null;return tkEdit()}
  if(k==='edit'){TK.edit=true;return tkEdit()}
  if(k==='cancel'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='تأكيد إلغاء المهمة';return}return tkAct('aei_task_cancel',{i:TK.cur.id,cancel:true,n:''},'أُلغيت المهمة',t)}
  if(k==='reopen')return tkAct('aei_task_cancel',{i:TK.cur.id,cancel:false,n:''},'أُعيد فتح المهمة',t);
  if(k==='del'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='تأكيد حذف المهمة نهائياً';return}
    return tkAct('aei_task_delete',{i:TK.cur.id},'حُذفت المهمة',t,()=>{TK.cur=null;dlg.close()})}
  if(k==='st'){TK.f.st=d.v;return tkView()}
  if(k==='who'){TK.f.who=d.v;TK.f.st='open';tkView();return scrollTo({top:0,behavior:'smooth'})}
  if(k==='scope'){TK.f.scope=d.v;return tkView()}
  if(k==='vs'){TK.f.vs=d.v;return tkView()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'&&ev.key!==' ')return;const t=ev.target;if(t&&t.matches&&t.matches('[data-tk="open"],.kpi[data-tk]')){ev.preventDefault();t.click()}});
document.addEventListener('toggle',ev=>{if(ev.target&&ev.target.id==='tk-sum')S.tkSum=ev.target.open},true);
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.id==='tkf-q'){TK.f.q=el.value;return tkView()}
  if(el.dataset&&el.dataset.draft)return tkDraft.set(el.dataset.draft,el.value);
  if(el.id&&el.id.startsWith('tkp-')){const a=el.id.slice(4),o=$('#tkpv-'+a),b=$('#tkpb-'+a);if(o)o.textContent=el.value+'%';if(b)b.textContent=+el.value===100?'إرسال للاعتماد':'حفظ التحديث'}});
document.addEventListener('change',ev=>{const m={'tkf-st':'st','tkf-who':'who','tkf-pr':'pr'}[ev.target.id];if(m){TK.f[m]=ev.target.value;tkView()}});
setInterval(()=>{if(!S.user||document.hidden)return;tkBadge();if(S.tab==='tasks'&&!dlg.open)tkLoad()},60000);

</script>
<script>
/* ---------- PWA: service worker + install button ---------- */
(()=>{const web=/^https?:$/.test(location.protocol),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(web&&'serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  const pill=document.getElementById('pwab'),link=document.getElementById('pwal');if(!web||standalone||!pill)return;
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),K='pwa-hide';let ev=null;
  const hidden=()=>{try{return Date.now()-(+localStorage.getItem(K)||0)<14*864e5}catch(e){return false}};
  const show=()=>{link.hidden=false;pill.hidden=hidden()},done=()=>{pill.hidden=true;link.hidden=true;ev=null};
  const help=()=>{dlg.innerHTML=head('تثبيت التطبيق على الجهاز')+'<div class="db"><div>على iPhone و iPad يتم التثبيت من متصفح Safari:</div><ol style="margin:0;padding-inline-start:20px;line-height:2.1"><li>اضغط زر <b>المشاركة</b> أسفل الشاشة (مربع بداخله سهم للأعلى).</li><li>اختر <b>إضافة إلى الشاشة الرئيسية</b>.</li><li>اضغط <b>إضافة</b>، وستظهر أيقونة التطبيق بين تطبيقاتك.</li></ol></div>';open()};
  const go=async()=>{if(ev){const e=ev;ev=null;e.prompt();try{const r=await e.userChoice;if(r&&r.outcome==='accepted')done();else ev=e}catch(x){}}else if(ios)help();else toast('افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».',6000)};
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;show()});
  addEventListener('appinstalled',()=>{done();toast('تم تثبيت التطبيق')});
  if(ios)show();
  document.getElementById('pwago').addEventListener('click',go);link.addEventListener('click',go);
  document.getElementById('pwax').addEventListener('click',()=>{pill.hidden=true;try{localStorage.setItem(K,String(Date.now()))}catch(e){}});
})();
</script>
</body>
