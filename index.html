const rpc=async(fn,args)=>{let r;try{r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CONFIG.SUPABASE_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw{code:'network',message:'لا يوجد اتصال بالإنترنت أو تعذّر الوصول إلى الخادم'}}
  const j=await r.json().catch(()=>null);if(!r.ok)throw{code:'error',message:(j&&j.message)||('HTTP '+r.status)};return j};
const subs={},snapOf=rows=>({docs:(rows||[]).map(x=>({id:x.id,data:()=>x.data})),empty:!(rows&&rows.length)});
async function refresh(c){if(!subs[c])return;const rows=await rpc('aei_list',{p:PIN,c});subs[c].forEach(f=>f(snapOf(rows)))}
const DB={doc(path){const [c,i]=path.split('/');return{set:d=>rpc('aei_set',{p:PIN,c,i,d}).then(()=>refresh(c)),update:d=>rpc('aei_update',{p:PIN,c,i,d}).then(()=>refresh(c)),delete:()=>rpc('aei_delete',{p:PIN,c,i}).then(()=>refresh(c))}},
 collection(c){const q={limit:()=>q,orderBy:()=>q,get:async()=>{const rows=await rpc('aei_list',{p:PIN,c});rows.sort((a,b)=>(b.data.ts||0)-(a.data.ts||0));return snapOf(rows.slice(0,2000))},
  onSnapshot(f,err){(subs[c]=subs[c]||[]).push(f);refresh(c).catch(e=>err&&err(e))},add:d=>rpc('aei_set',{p:PIN,c,i:Date.now().toString(36)+Math.random().toString(36).slice(2,7),d})};return q}};
setInterval(()=>{if(!document.hidden&&!dlg.open&&S.ready)Object.keys(subs).forEach(c=>refresh(c).catch(()=>{}))},30000);

  for(const tr of t.tBodies[0].rows){if(tr.classList.contains('grp')||(tr.cells.length===1&&tr.cells[0].colSpan>1))continue;
    let ci=0,k=0,found=null,covered=false;
    while(ci<=col){if(carry[ci]>0){if(ci===col)covered=true;carry[ci]--;ci++;continue}
      const c=tr.cells[k++];if(!c)break;const span=c.colSpan||1;
      for(let j=0;j<span;j++)if((c.rowSpan||1)>1)carry[ci+j]=c.rowSpan-1;
      if(col>=ci&&col<ci+span)found=span>1?'':c;ci+=span}
    for(let j=ci;j<carry.length;j++){} 
    if(covered)continue;if(found===null)continue;
    if(found===''){out.push('');continue}
    const sel=found.querySelector('select');if(sel){out.push(sel.value);continue}
    const cl=found.cloneNode(true);cl.querySelectorAll('.fp,.flag,.ibs,.btn,div.muted,small').forEach(x=>x.remove());cl.querySelectorAll('br').forEach(x=>x.replaceWith(' / '));
    out.push(cl.textContent.replace(/\s+/g,' ').trim())}
  return out}
async function copyCol(th){const vals=colValues(th),txt=vals.join('\n'),name=th.textContent.trim();if(!vals.length)return toast('لا توجد بيانات للنسخ');
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';(dlg.open?dlg:document.body).appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}}
  const b=th.querySelector('.cpb');if(ok&&b){b.innerHTML=CPOK;b.classList.add('done');setTimeout(()=>{b.innerHTML=CPI;b.classList.remove('done')},1500)}
  toast(ok?`نُسخ ${vals.length} قيمة من عمود «${name}»`:'تعذّر النسخ في هذا المتصفح')}
document.addEventListener('click',ev=>{const b=ev.target.closest('.cpb');if(b)copyCol(b.closest('th'))});
const numAll=()=>document.querySelectorAll('#app table,#dlg table').forEach(numTable);
new MutationObserver(numAll).observe(document.getElementById('app'),{childList:true,subtree:true});
new MutationObserver(numAll).observe(document.getElementById('dlg'),{childList:true,subtree:true});
/* ---------- events ---------- */
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;({lockf:submitLock,empf:()=>saveEmp(f),movef:()=>saveMove(f),resf:()=>saveResign(f),focf:()=>saveFocal(f),leavef:()=>saveLeave(f),pcf:()=>savePC(f),phf:()=>saveHol(f),ppf:()=>savePeople(f),ptf:()=>savePoint(f),pinf:()=>savePin(f)})[f.getAttribute('id')]?.()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-tab],[data-go],[data-pcell],[data-phol],[data-pcopy],[data-pm],[data-act],[data-move],[data-edit],[data-del],[data-resign],[data-focal],[data-ldel],[data-ptedit],[data-pt],[data-restore],[data-copy],[data-emp]');if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;render()}
  else if(d.pcell)planCell(d.pcell); else if(d.phol)planHol(d.phol); else if(d.pcopy)planCopy(t);
  else if(d.pm){const [y,mo]=S.pm.split('-').map(Number),x=new Date(y,mo-1+(+d.pm),1);S.pm=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');render()}
  else if(d.act==='ppeople')planPeople(); else if(d.act==='pexport')planExport(); else if(d.act==='plnew')planLink(t,false); else if(d.act==='ploff')planLink(t,true);
  else if(d.act==='pclear')savePC(t.closest('form'),true); else if(d.act==='preset'){$('#e-people').value=defaultPeople().join('\n')}
  else if(d.go){S.tab=d.go;if(d.gof==='bad')S.f={q:'',region:'',psup:'',point:'',track:'',cat:'',bad:true};if(d.gof==='nofocal'||d.gof==='nocoord')S.pf={q:'',region:'',sup:'',type:''};render();window.scrollTo(0,0)}
  else if(d.act==='mismatch')showMismatch();
  else if(d.act==='close')dlg.close(); else if(d.act==='add')editEmp(); else if(d.act==='export')exportXlsx(); else if(d.act==='pin')pinDlg(); else if(d.act==='logout'){try{sessionStorage.removeItem('u')}catch(e){}location.reload()}
  else if(d.move)moveEmp(d.move); else if(d.edit)editEmp(d.edit); else if(d.del)delEmp(t); else if(d.resign)resignEmp(d.resign); else if(d.focal)focalDlg(d.focal); else if(d.ldel)delLeave(t); else if(d.ptedit)editPoint(d.ptedit); else if(d.pt)showPoint(d.pt); else if(d.act==='ptexport')exportPts(); else if(d.act==='home')renderHome(); else if(d.act==='leave')renderLeave(); else if(d.act==='login')renderLock(); else if(d.restore)restoreEmp(t);
  else if(d.copy)navigator.clipboard?.writeText(d.copy).then(()=>toast('تم النسخ'),()=>toast('حدّد الرقم وانسخه يدوياً'));
  else if(d.emp)showEmp(d.emp)});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.id?.startsWith('f-')){const k=el.id.slice(2);S.f[k]=el.type==='checkbox'?el.checked:el.value;vDb();if(k==='q'){const q=$('#f-q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(el.id&&el.id.startsWith('pf-')){const k=el.id.slice(3);S.pf[k]=el.value;vPts();if(k==='q'){const q=$('#pf-q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}
  if(el.id==='g-month'){S.month=el.value;applyMonth();render();return}
  if(el.id==='e-point'){const i=pointInfo(el.value.trim());if(i)for(const k of ['psup','region','area']){const x=el.form.querySelector('#e-'+k);if(x)x.value=i[k]}}});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset&&el.dataset.newable&&el.value==='__new__'){const i=document.createElement('input');i.id=el.id;i.name=el.name;i.placeholder='اكتب القيمة الجديدة';i.required=el.required;el.replaceWith(i);i.focus();return}if(el.dataset&&el.dataset.lstatus)S.db.doc('leave/'+el.dataset.lstatus).update({status:el.value}).then(()=>toast('حُدّثت حالة الطلب'),e=>toast('لم تُحفظ: '+e.message))});
dlg.addEventListener('click',ev=>{if(ev.target===dlg)dlg.close()});
