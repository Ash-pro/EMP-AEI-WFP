<script>
document.documentElement.dir='rtl'; document.documentElement.lang='ar';
const $=s=>document.querySelector(s), app=$('#app'), dlg=$('#dlg');
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRACKS=['وقائي','علاجي','كاش','أمن','إداري'], TCLS={'وقائي':'t-prev','علاجي':'t-cure','كاش':'t-cash','أمن':'t-sec','إداري':'t-adm'};

 ['degree','الدرجة العلمية'],['major','التخصص'],['grad','تاريخ الحصول على الشهادة'],['pay','طريقة تلقي الراتب'],['iban','الأيبان / رقم المحفظة']];

 edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
 focal:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function hp(p){let a=0x811c9dc5,b=0x1234567;for(const ch of 'aei-wfp:'+p){const c=ch.charCodeAt(0);a^=c;a=Math.imul(a,16777619);b=Math.imul(b^c,0x5bd1e995);b^=b>>>13}return (a>>>0).toString(16)+(b>>>0).toString(16)}

function issues(e){const r=[];
  if(!/^\d{9}$/.test(e.id||''))r.push('رقم الهوية ليس 9 أرقام');

  return r}
const all=()=>[...S.emps.values()];

const curMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mLabel=m=>m==='all'?'كل الأشهر':MN[+m.slice(5)-1]+' '+m.slice(0,4)+(m===curMonth()?' (الحالي)':'');
const selMonth=()=>S.month||curMonth(), isArch=()=>selMonth()!=='all'&&selMonth()!==curMonth();
function monthList(){const c=curMonth(),set=new Set([c,...S.snaps.keys()]);
  for(const x of S.leaves.values()){if(x.start)set.add(x.start.slice(0,7));if(x.end)set.add(x.end.slice(0,7))}

  let m=[...set].filter(x=>/^\d{4}-\d\d$/.test(x)&&x<=c).sort()[0],out=[];
  while(m<=c){out.push(m);let y=+m.slice(0,4),k=+m.slice(5)+1;if(k>12){k=1;y++}m=y+'-'+String(k).padStart(2,'0')}
  return out.reverse()}

  S.emps=src;document.body.classList.toggle('arch',isArch())}
const inMonthLeave=x=>{const m=selMonth();return m==='all'||((x.start||'')<=m+'-31'&&(x.end||'')>=m+'-01')};
const inMonthRes=e=>{const m=selMonth();return m==='all'||(e.resignDate||'').slice(0,7)===m};

  catch(e){throw{code:'network',message:'لا يوجد اتصال بالإنترنت أو تعذّر الوصول إلى الخادم'}}
  const j=await r.json().catch(()=>null);if(!r.ok)throw{code:'error',message:(j&&j.message)||('HTTP '+r.status)};return j};
const subs={},snapOf=rows=>({docs:(rows||[]).map(x=>({id:x.id,data:()=>x.data})),empty:!(rows&&rows.length)});

 collection(c){const q={limit:()=>q,orderBy:()=>q,get:async()=>{const rows=await rpc('aei_list',{p:PIN,c});rows.sort((a,b)=>(b.data.ts||0)-(a.data.ts||0));return snapOf(rows.slice(0,2000))},
  onSnapshot(f,err){(subs[c]=subs[c]||[]).push(f);refresh(c).catch(e=>err&&err(e))},add:d=>rpc('aei_set',{p:PIN,c,i:Date.now().toString(36)+Math.random().toString(36).slice(2,7),d})};return q}};

  const d=new Date(),mm=selMonth(),name=mm==='all'?`موظفو AEI-WFP كل الأشهر ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}.xlsx`:`موظفو AEI-WFP ${mm.slice(5)}.${mm.slice(0,4)}.xlsx`;
  try{const u=URL.createObjectURL(new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('تم تنزيل الملف')}catch(e){toast('تعذّر التصدير: '+(e.message||e))}}
function filteredAllSorted(){const f=S.f;S.f={q:'',region:'',psup:'',point:'',track:'',cat:'',bad:false};const r=filtered();S.f=f;return r}

/* ---------- events ---------- */
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;({lockf:submitLock,empf:()=>saveEmp(f),movef:()=>saveMove(f),resf:()=>saveResign(f),focf:()=>saveFocal(f),leavef:()=>saveLeave(f),pinf:()=>savePin(f)})[f.getAttribute('id')]?.()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-tab],[data-act],[data-move],[data-edit],[data-del],[data-resign],[data-focal],[data-ldel],[data-restore],[data-copy],[data-emp]');if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;render()}
  else if(d.act==='close')dlg.close(); else if(d.act==='add')editEmp(); else if(d.act==='export')exportXlsx(); else if(d.act==='pin')pinDlg(); else if(d.act==='logout'){try{sessionStorage.removeItem('u')}catch(e){}location.reload()}
  else if(d.move)moveEmp(d.move); else if(d.edit)editEmp(d.edit); else if(d.del)delEmp(t); else if(d.resign)resignEmp(d.resign); else if(d.focal)focalDlg(d.focal); else if(d.ldel)delLeave(t); else if(d.act==='home')renderHome(); else if(d.act==='leave')renderLeave(); else if(d.act==='login')renderLock(); else if(d.restore)restoreEmp(t);
  else if(d.copy)navigator.clipboard?.writeText(d.copy).then(()=>toast('تم النسخ'),()=>toast('حدّد الرقم وانسخه يدوياً'));
  else if(d.emp)showEmp(d.emp)});
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.id?.startsWith('f-')){const k=el.id.slice(2);S.f[k]=el.type==='checkbox'?el.checked:el.value;vDb();if(k==='q'){const q=$('#f-q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(el.id==='g-month'){S.month=el.value;applyMonth();render();return}
  if(el.id==='e-point'){const i=pointInfo(el.value.trim());if(i)for(const k of ['psup','region','area']){const x=el.form.querySelector('#e-'+k);if(x)x.value=i[k]}}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset&&el.dataset.lstatus)S.db.doc('leave/'+el.dataset.lstatus).update({status:el.value}).then(()=>toast('حُدّثت حالة الطلب'),e=>toast('لم تُحفظ: '+e.message))});
dlg.addEventListener('click',ev=>{if(ev.target===dlg)dlg.close()});
</script>
